services:
  - type: web
    name: compeng-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT -k gthread
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: CLASS_ACCESS_CODE
        value: compeng-2025
      - key: DATABASE_URL
        fromDatabase:
          name: compeng-db
          property: connectionString

databases:
  - name: compeng-db
    plan: free
    databaseName: compeng_portal